services:
  api:
    build: .
    image: replica-reconciler:latest
    container_name: replica-reconciler
    ports:
      - "8000:8000"
    environment:
      # SQLite database file kept on the named volume below so histories
      # survive container restarts/recreates.
      HISTORY_DB_PATH: /data/history.db
    volumes:
      - history-data:/data
    restart: unless-stopped

volumes:
  history-data:
